<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main>
      <input type="text" id="display" value="0" dir="rtl" readonly />
      <section class="buttons">
        <div class="digits">
          <div class="row">
            <button>7</button><button>8</button><button>9</button>
          </div>
          <div class="row">
            <button>4</button><button>5</button><button>6</button>
          </div>
          <div class="row">
            <button>1</button><button>2</button><button>3</button>
          </div>
          <div class="row">
            <button class="c">C</button><button>0</button><button>.</button>
          </div>
        </div>
        <div class="operators">
          <div class="row"><button class="del">Del</button></div>
          <div class="row"><button>x</button><button>/</button></div>
          <div class="row"><button>-</button><button>+</button></div>
          <div class="row"><button class="equality">=</button></div>
        </div>
      </section>
    </main>
  </body>
</html>
